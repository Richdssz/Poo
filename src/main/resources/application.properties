
spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

# Database Configuration (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pi3_database}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Port
server.port=${PORT:8080}

# Supabase JWT Authentication
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cdspheynyerzifbaahkf.supabase.co/auth/v1
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://cdspheynyerzifbaahkf.supabase.co/auth/v1/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256
